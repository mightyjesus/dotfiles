##############################
# APPEARANCE
##############################

general {
    gaps_in = 5
    gaps_out = 5
    border_size = 1

    col.active_border = rgba(73AFE8ff) rgba(000000ff) 45deg
    col.inactive_border = rgba(595959aa)

    resize_on_border = false
    allow_tearing = false

    layout = master
}


decoration {
    rounding = 15
    rounding_power = 5

    active_opacity = 1.0
    inactive_opacity = 0.80
    

    shadow {
        enabled = true
        range = 4
        render_power = 2
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.12
    }
}


##############################
# ANIMATIONS (FIXED)
##############################

animations {
    enabled = true

    bezier = smooth, 0.25, 0.1, 0.25, 1.0

    animation = windowsIn, 1, 2.5, smooth, popin 87%
    animation = windowsOut, 1, 2, smooth, popin 87%

    animation = windowsMove, 1, 2, smooth

    animation = fadeIn, 1, 2, smooth
    animation = fadeOut, 1, 2, smooth

    animation = border, 1, 4, smooth

    animation = workspaces, 1, 3, smooth, slide

    animation = layersIn, 1, 2, smooth
    animation = layersOut, 1, 2, smooth

    animation = specialWorkspaceIn, 1, 2, smooth, slidevert
    animation = specialWorkspaceOut, 1, 2, smooth, slidevert
}


##############################
# ENVIRONMENT
##############################

env = XCURSOR_SIZE,20
env = HYPRCURSOR_SIZE,20
env = QT_QPA_PLATFORMTHEME,qt6ct




###############################
# LAYOUTS
##############################

master { new_status = slave mfact = 0.5 orientation = left mfact = 0.55 }
